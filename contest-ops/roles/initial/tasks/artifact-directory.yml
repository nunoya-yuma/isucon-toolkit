---
- name: Create a private local directory per host and run
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ansible_remote_tmp: "{{ lookup('env', 'ANSIBLE_LOCAL_TEMP') }}"
  ansible.builtin.file:
    path: "{{ ops_artifact_root }}/{{ ops_run_id }}/{{ inventory_hostname }}"
    state: directory
    mode: '0700'
