---
- import_playbook: preflight.yml

- name: Record the baseline without changing target configuration
  hosts: app:proxy:db
  gather_facts: false
  become: "{{ ops_become }}"
  vars_files: ["{{ ops_config_file }}"]
  roles: [ops_defaults]
  tasks:
    - ansible.builtin.import_role:
        name: initial
        tasks_from: inspect
